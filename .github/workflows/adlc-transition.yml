name: ADLC transition

run-name: ADLC transition ${{ inputs.operation_input_digest }} @ ${{ github.workflow_sha }}

on:
  workflow_dispatch:
    inputs:
      operation_payload:
        description: Exact canonical transition operation JSON.
        required: true
        type: string
      operation_input_digest:
        description: SHA-256 digest of operation_payload.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/agentic-os/bin/agentic-os-transition.mjs validate-event
