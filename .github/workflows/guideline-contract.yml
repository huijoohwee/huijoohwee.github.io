name: Guideline Contract

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guideline-contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Checkout Agentic Canvas OS registrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huijoohwee/agentic-canvas-os
          ref: d6433142be25d06d25e5961470101eed4c1eed18
          path: agentic-canvas-os
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize required Task 19 workspace inputs
        run: |
          printf '%s\n' 'node_modules/' 'agentic-canvas-os/' >> .git/info/exclude
          mkdir -p "${GITHUB_WORKSPACE}/../.coordination"
          cp scripts/__tests__/fixtures/coordination/dev-source-resolver-cloud-request.json "${GITHUB_WORKSPACE}/../.coordination/"
          cp scripts/__tests__/fixtures/coordination/dev-source-resolver-write-scope.json "${GITHUB_WORKSPACE}/../.coordination/"
          cp scripts/__tests__/fixtures/coordination/git-guidelines-protected-squash-repair-cloud-authority.json "${GITHUB_WORKSPACE}/../.coordination/"
          cp scripts/__tests__/fixtures/coordination/git-guidelines-protected-squash-repair-write-scope.json "${GITHUB_WORKSPACE}/../.coordination/"
      - run: npm test
        env:
          AGENTIC_CANVAS_OS_ROOT: ${{ github.workspace }}/agentic-canvas-os

  agentic-sdlc-policy-contract:
    if: ${{ always() }}
    needs: [guideline-contract-check]
    name: agentic-sdlc-policy-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the focused contract check
        env:
          CONTRACT_RESULT: ${{ needs.guideline-contract-check.result }}
        run: test "$CONTRACT_RESULT" = "success"
