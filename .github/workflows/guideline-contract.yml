name: Guideline Contract

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guideline-contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  agentic-sdlc-policy-contract:
    if: ${{ always() }}
    needs: [guideline-contract-check]
    name: agentic-sdlc-policy-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the focused contract check
        env:
          CONTRACT_RESULT: ${{ needs.guideline-contract-check.result }}
        run: test "$CONTRACT_RESULT" = "success"
