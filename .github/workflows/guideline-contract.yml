name: Guideline Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guideline-contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact pull-request branch identity
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PROVIDER_REVISION: ${{ github.sha }}
        run: |
          git check-ref-format --branch "$REVIEW_BRANCH"
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          git checkout -B "$REVIEW_BRANCH" "$REVIEW_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          # The shared verifier binds the provider revision to both event parents.
          # An explicit head checkout may not have fetched the synthetic merge.
          git cat-file -e "$PROVIDER_REVISION^{commit}" || git fetch --no-tags origin "$PROVIDER_REVISION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Agentic OS owns lane and release authority outside candidate-run CI.
      # This job validates only the site's deterministic content contracts.
      - name: Materialize deterministic workspace references
        run: |
          printf '%s\n' 'node_modules/' >> .git/info/exclude
          mkdir -p "${GITHUB_WORKSPACE}/../.coordination"
          cp scripts/__tests__/fixtures/coordination/dev-source-resolver-cloud-request.json "${GITHUB_WORKSPACE}/../.coordination/"
          cp scripts/__tests__/fixtures/coordination/dev-source-resolver-write-scope.json "${GITHUB_WORKSPACE}/../.coordination/"
      - run: npm ci
      - run: npm test
        env:
          GIT_GUIDELINES_EXPECTED_PROTECTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - name: Checkout reviewed Markdown sync verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huijoohwee/agentic-os
          ref: b8becb04f93813bd209f8cc7f711558062a98091
          path: .doc-sync-os
          persist-credentials: false
      - name: Check enrolled website document
        run: >-
          node .doc-sync-os/scripts/doc-sync.mjs
          --mode=check --repo=. --source-repo=.
          --document=docs/document-maintenance.md
          --to=a9ab28adedf0d96b74670f459315560fa854b3b5

  adlc-policy-contract:
    if: ${{ always() }}
    needs: [guideline-contract-check]
    name: adlc-policy-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the focused contract check
        env:
          CONTRACT_RESULT: ${{ needs.guideline-contract-check.result }}
        run: test "$CONTRACT_RESULT" = "success"
