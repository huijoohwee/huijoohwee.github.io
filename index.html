    <style>
      :root {
        color-scheme: light dark;

      }

      body {
        margin: 0;
      }

      main {
        width: min(42rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 12vh 0 4rem;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.5rem, 9vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 58ch;
        margin: 1.5rem 0 2.5rem;
        font-size: 1.1rem;
        line-height: 1.65;
      }

      nav {
        display: grid;
        gap: 0.75rem;
      }

      a {
        padding: 1rem 1.1rem;
        border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
        border-radius: 0.75rem;
        color: inherit;
        font-weight: 650;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: LinkText;
        color: LinkText;
      }
