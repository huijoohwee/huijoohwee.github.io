name: ADLC authority

run-name: ADLC authority ${{ inputs.authority_input_digest }} @ ${{ github.workflow_sha }}

on:
  workflow_dispatch:
    inputs:
      authority_payload:
        description: Exact canonical request and recovery candidate JSON.
        required: true
        type: string
      authority_input_digest:
        description: SHA-256 of the exact authority input and committed policy.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind enrollment to this repository
        run: |
          node --input-type=module -e '
            import { loadAuthorityDispatch } from "./node_modules/agentic-os/bin/agentic-os-authority.mjs";
            const { dispatch } = loadAuthorityDispatch(process.env.GITHUB_EVENT_PATH);
            const target = "github.com/huijoohwee/huijoohwee.github.io";
            if (dispatch.request.repository !== target || dispatch.candidate.targetRepository !== target) {
              throw new Error("authority target is outside this enrollment");
            }
          '
      - name: Validate exact authority input without publication credentials
        run: |
          node node_modules/agentic-os/bin/agentic-os-authority.mjs \
            validate-event \
            --event="$GITHUB_EVENT_PATH" \
            --policy=.github/adlc-authority-policy.json
