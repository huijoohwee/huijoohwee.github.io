name: Guideline Contract

on:
  pull_request:
    paths:
      - "guidelines/agentic-sdlc-guidelines.md"
      - "scripts/check-agentic-sdlc-guideline.mjs"
      - "package.json"
      - ".github/workflows/guideline-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "guidelines/agentic-sdlc-guidelines.md"
      - "scripts/check-agentic-sdlc-guideline.mjs"
      - "package.json"
      - ".github/workflows/guideline-contract.yml"

permissions:
  contents: read

jobs:
  guideline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run guideline:check
